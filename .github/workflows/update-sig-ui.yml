name: Atualizar interface SIG
on:
  push:
    paths:
      - '.github/workflows/update-sig-ui.yml'
permissions:
  contents: write
jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar interface
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('v2.html')
          s=p.read_text(encoding='utf-8')

          # Barra de ações dos processos
          old="""<div class=\"toolbar\"><div><h3 style=\"margin-bottom:4px\">Processos</h3><div class=\"small\">Use “Atualizar processo” para consultar automaticamente as fontes disponíveis (DataJud e tribunal).</div></div><button class=\"primary\" onclick=\"openM('mProcesso')\">+ Novo processo</button></div>"""
          new="""<div class=\"toolbar\"><div><h3 style=\"margin-bottom:4px\">Processos</h3><div class=\"small\">Cadastre individualmente ou importe vários números CNJ de uma vez. A atualização tenta as fontes gratuitas disponíveis.</div></div><div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"secondary\" onclick=\"openM('mImportar')\">Importar em lote</button><button class=\"secondary\" id=\"btnAtualizarTodos\" onclick=\"atualizarTodos(this)\">Atualizar todos</button><button class=\"primary\" onclick=\"openM('mProcesso')\">+ Novo processo</button></div></div>"""
          if old in s:
              s=s.replace(old,new)

          # Modal de importação em lote
          marker='<div id="mProcesso" class="modal hidden">'
          modal='''<div id="mImportar" class="modal hidden"><div class="card"><h3>Importar processos em lote</h3><p class="small">Cole os números CNJ, um por linha ou separados por espaço, vírgula ou ponto e vírgula. Números já cadastrados serão ignorados.</p><form id="fImportar"><label>Números CNJ</label><textarea id="listaCnj" rows="10" placeholder="1002179-15.2024.8.26.0238\n0000000-00.2026.5.02.0000" required></textarea><div class="actions"><button type="button" class="secondary" onclick="closeM('mImportar')">Cancelar</button><button class="primary">Importar</button></div></form></div></div>'''
          if 'id="mImportar"' not in s:
              s=s.replace(marker,modal+marker)

          # Helpers e funções
          fn_marker='async function init(){'
          helpers=r'''function normalizaCNJ(v){return String(v||'').replace(/\D/g,'')}function formataCNJ(n){return String(n||'').replace(/^(\d{7})(\d{2})(\d{4})(\d)(\d{2})(\d{4})$/,'$1-$2.$3.$4.$5.$6')}function tribunalDoCNJ(n){n=normalizaCNJ(n);if(n.length!==20)return null;const ramo=n[13],tr=n.slice(14,16);if(ramo==='8'){const uf={'01':'TJAC','02':'TJAL','03':'TJAP','04':'TJAM','05':'TJBA','06':'TJCE','07':'TJDFT','08':'TJES','09':'TJGO','10':'TJMA','11':'TJMT','12':'TJMS','13':'TJMG','14':'TJPA','15':'TJPB','16':'TJPR','17':'TJPE','18':'TJPI','19':'TJRJ','20':'TJRN','21':'TJRS','22':'TJRO','23':'TJRR','24':'TJSC','25':'TJSE','26':'TJSP','27':'TJTO'};return uf[tr]||null}if(ramo==='5')return 'TRT'+Number(tr);if(ramo==='4')return 'TRF'+Number(tr);return null}async function importarLote(){const raw=$('listaCnj').value||'';const encontrados=[...raw.matchAll(/\d[\d.\-\s]{15,30}\d/g)].map(m=>normalizaCNJ(m[0])).filter(n=>n.length===20);const nums=[...new Set(encontrados)];if(!nums.length)return alert('Nenhum número CNJ válido foi identificado.');const existentes=new Set(D.processos.map(x=>normalizaCNJ(x.numero_cnj)));const novos=nums.filter(n=>!existentes.has(n));if(!novos.length){alert('Todos os processos informados já estão cadastrados.');return}const rows=novos.map(n=>({user_id:U.id,numero_cnj:formataCNJ(n),titulo:'Processo '+formataCNJ(n),tribunal:tribunalDoCNJ(n),status:'ativo',monitorar_datajud:true}));const {error}=await sb.from('processos').insert(rows);if(error)return alert('Falha na importação: '+error.message);$('fImportar').reset();closeM('mImportar');await load();alert(`${rows.length} processo(s) importado(s). ${nums.length-rows.length} já existente(s) ignorado(s).`)}async function atualizarTodos(btn){const procs=D.processos.filter(x=>normalizaCNJ(x.numero_cnj).length===20);if(!procs.length)return alert('Não há processos com número CNJ válido para atualizar.');const antigo=btn.textContent;btn.disabled=true;let ok=0,encontrados=0,captcha=0,erros=0,novas=0;try{for(let i=0;i<procs.length;i++){btn.textContent=`Atualizando ${i+1}/${procs.length}`;try{const {data,error}=await sb.functions.invoke('consultar-datajud',{body:{processo_id:procs[i].id}});if(error||data?.error){erros++;continue}ok++;novas+=Number(data?.novas||0);if(data?.encontrado)encontrados++;if(data?.captcha)captcha++}catch(_e){erros++}}await load();alert(`Atualização concluída.\nProcessos consultados: ${procs.length}\nConsultas concluídas: ${ok}\nLocalizados automaticamente: ${encontrados}\nCom validação manual: ${captcha}\nNovas movimentações: ${novas}\nFalhas: ${erros}`)}finally{btn.disabled=false;btn.textContent=antigo}}'''
          if 'async function importarLote()' not in s:
              s=s.replace(fn_marker,helpers+fn_marker)

          # Evento do formulário de lote
          event_marker="$('fCliente').onsubmit=e=>"
          if "$('fImportar').onsubmit" not in s:
              s=s.replace(event_marker,"$('fImportar').onsubmit=e=>{e.preventDefault();importarLote()};"+event_marker)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "SIG Automação"
          git config user.email "actions@users.noreply.github.com"
          git add v2.html
          git commit -m "Adiciona importação em lote e atualização de todos os processos"
          git push
