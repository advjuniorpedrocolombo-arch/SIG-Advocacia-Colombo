<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIG — Importador e-SAJ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3fb;color:#173b72;font-size:12px;font-weight:bold}button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font:inherit}.primary{background:#173b72;color:#fff}.secondary{background:#eef3fb;color:#173b72}.msg{margin-top:14px;padding:12px;border-radius:8px}.ok{background:#dcfae6;color:#067647}.err{background:#fee4e2;color:#b42318}.small{font-size:13px;color:#667085;line-height:1.5}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}pre{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:8px;font-size:12px;max-height:260px;overflow:auto}
</style>
</head>
<body><div class="wrap"><div class="card"><span class="tag">Integração local</span><h2>Importar processo do e-SAJ</h2><p class="small">Esta página recebe os dados capturados pela extensão no e-SAJ já autenticado. O certificado, token e PIN não saem do seu computador.</p><div id="sessao" class="small"></div><div class="row"><button id="ler" class="primary">Ler dados copiados</button><button id="voltar" class="secondary">Voltar ao SIG</button></div><div id="msg"></div><pre id="preview" style="display:none"></pre></div></div>
<script>
const SUPA_URL='https://dmvytzyfzeytfrddyucv.supabase.co';
const SUPA_KEY='sb_publishable_ds9oZD_c1nMz9MwK-E4bTA_gzh4ubsb';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);const $=x=>document.getElementById(x);
function norm(v){return String(v||'').replace(/\D/g,'')}
function fmt(n){n=norm(n);return n.replace(/^(\d{7})(\d{2})(\d{4})(\d)(\d{2})(\d{4})$/,'$1-$2.$3.$4.$5.$6')}
function show(t,ok=false){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}
function parseData(s){const m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/);if(!m)return new Date().toISOString();return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]),Number(m[4]||12),Number(m[5]||0)).toISOString()}
async function sessao(){const {data}=await sb.auth.getSession();if(data.session){$('sessao').textContent='SIG conectado: '+data.session.user.email;return data.session.user} $('sessao').textContent='Você não está conectado ao SIG nesta aba. Abra o SIG, faça login e volte aqui.';return null}
$('voltar').onclick=()=>location.href='v2.html';
$('ler').onclick=async()=>{
  try{
    $('ler').disabled=true;show('Lendo os dados capturados...',true);
    const user=await sessao();if(!user)throw new Error('Faça login no SIG primeiro e depois retorne ao importador.');
    const raw=await navigator.clipboard.readText();if(!raw)throw new Error('Não há dados copiados. Volte ao e-SAJ e use a extensão “SIG — Conector e-SAJ”.');
    const p=JSON.parse(raw);if(!p.numero_cnj)throw new Error('Os dados copiados não parecem vir do conector e-SAJ.');
    const numero=fmt(p.numero_cnj);$('preview').style.display='block';$('preview').textContent=[numero,p.classe,p.assunto,p.vara,`${(p.movimentos||[]).length} movimentação(ões) capturada(s)`].filter(Boolean).join('\n');
    let {data:proc,error}=await sb.from('processos').select('id,user_id,numero_cnj,titulo').eq('numero_cnj',numero).limit(1);if(error)throw error;
    if(!proc?.length){const {data:novo,error:e2}=await sb.from('processos').insert({user_id:user.id,numero_cnj:numero,titulo:p.classe?`${p.classe} — ${numero}`:`Processo ${numero}`,tribunal:'TJSP',comarca:p.foro||null,vara:p.vara||null,status:'ativo',monitorar_datajud:true,datajud_status:'Importado do e-SAJ'}).select('id,user_id,numero_cnj,titulo').single();if(e2)throw e2;proc=[novo]}
    const processo=proc[0];
    const {data:existentes,error:e3}=await sb.from('movimentacoes').select('descricao').eq('processo_id',processo.id).limit(1000);if(e3)throw e3;
    const setExist=new Set((existentes||[]).map(x=>String(x.descricao||'').trim()));
    const novos=(p.movimentos||[]).filter(m=>m.descricao&&!setExist.has(String(m.descricao).trim()));
    if(novos.length){const rows=novos.map(m=>({user_id:user.id,processo_id:processo.id,data_movimentacao:parseData(m.data),descricao:m.descricao,origem:'e-SAJ (sessão local)',nova:true,analisada:false}));const {error:e4}=await sb.from('movimentacoes').insert(rows);if(e4)throw e4}
    const detalhes=[p.classe&&('Classe: '+p.classe),p.assunto&&('Assunto: '+p.assunto),p.foro&&('Foro: '+p.foro),p.vara&&('Vara: '+p.vara),p.juiz&&('Juiz: '+p.juiz),p.partes&&('Partes: '+p.partes)].filter(Boolean).join(' | ');
    if(detalhes&&!setExist.has(detalhes)){await sb.from('movimentacoes').insert({user_id:user.id,processo_id:processo.id,data_movimentacao:new Date().toISOString(),descricao:detalhes,origem:'e-SAJ — dados processuais',nova:true,analisada:false})}
    await sb.from('processos').update({datajud_status:'Importado do e-SAJ',tribunal:'TJSP',comarca:p.foro||null,vara:p.vara||null}).eq('id',processo.id);
    show(`Processo ${numero} importado. ${novos.length} nova(s) movimentação(ões) adicionada(s).`,true);
  }catch(e){show(e.message||String(e))}finally{$('ler').disabled=false}
};
sessao();
</script>
</body></html>
