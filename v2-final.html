<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIG — Advocacia Colombo</title>
</head>
<body>
<div style="font-family:Arial,sans-serif;padding:32px;text-align:center">Carregando SIG...</div>
<script>
(async()=>{
  try{
    const r=await fetch('v2.html?v=20260912-1548',{cache:'no-store'});
    if(!r.ok) throw new Error('Falha ao carregar V2: HTTP '+r.status);
    let html=await r.text();
    html=html.replace('.hidden{display:none}', '.hidden{display:none!important}');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:32px;color:#b42318">'+e.message+'</div>';
  }
})();
</script>
</body>
</html>
