<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIG — Advocacia Colombo</title>
</head>
<body>
<div id="loader" style="font-family:Arial,sans-serif;padding:32px;text-align:center">Carregando SIG...</div>
<script>
(async()=>{
  try{
    const fonte='https://raw.githubusercontent.com/advjuniorpedrocolombo-arch/SIG-Advocacia-Colombo/a7b40986041f2a2fdfc9f32672258ab2ed705d8d/v2.html?ts='+Date.now();
    const r=await fetch(fonte,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();

    html=html.replace(
      "const t=await fetch('index.html').then(r=>r.text());",
      "const t=await fetch('esaj-importador.html?ts='+Date.now(),{cache:'no-store'}).then(r=>r.text());"
    );

    html=html.replace(
      '<button class="secondary" id="btnAtualizarTodos" onclick="atualizarTodos(this)">Atualizar todos</button>',
      '<button type="button" class="secondary" id="btnAtualizarTodos" onclick="prepararLoteEsaj(this);return false;">Atualizar e-SAJ (lote)</button>'
    );

    html=html.replace(
      'Cadastre individualmente ou importe vários números CNJ de uma vez. A atualização tenta as fontes gratuitas disponíveis.',
      'Cadastre individualmente ou importe vários números CNJ de uma vez. Para processos TJSP, use a atualização em lote pela sessão autenticada do e-SAJ.'
    );

    html=html.replace(
      "const encontrados=[...raw.matchAll(/\\d[\\d.\\-\\s]{15,30}\\d/g)].map(m=>normalizaCNJ(m[0])).filter(n=>n.length===20);",
      "const encontrados=(raw.match(/\\d{7}-\\d{2}\\.\\d{4}\\.\\d\\.\\d{2}\\.\\d{4}/g)||[]).map(normalizaCNJ).filter(n=>n.length===20);"
    );

    const extraScript = `
<script>
async function prepararLoteEsaj(btn){
  const textoOriginal=btn?.textContent||'Atualizar e-SAJ (lote)';
  try{
    if(btn){btn.disabled=true;btn.textContent='Preparando lote...';}
    const normaliza=v=>String(v||'').replace(/\\D/g,'');
    const {data,error}=await sb.from('processos').select('id,numero_cnj,titulo,tribunal,status').order('titulo');
    if(error) throw error;
    const processos=(data||[]).filter(p=>{
      const n=normaliza(p.numero_cnj);
      return n.length===20 && (n.slice(13,16)==='826' || String(p.tribunal||'').toUpperCase()==='TJSP') && p.status!=='arquivado';
    });
    if(!processos.length){alert('Nenhum processo TJSP ativo foi encontrado no SIG.');return;}
    const pacote={tipo:'SIG_ESAJ_LOTE',gerado_em:new Date().toISOString(),processos:processos.map(p=>({id:p.id,numero_cnj:p.numero_cnj,titulo:p.titulo}))};
    await navigator.clipboard.writeText(JSON.stringify(pacote));
    alert('Lote com '+processos.length+' processo(s) TJSP preparado e copiado. Agora abra a extensão SIG — Conector e-SAJ e clique em “Atualizar lote copiado”. O SIG permanecerá nesta tela.');
  }catch(e){console.error(e);alert('Não foi possível preparar o lote e-SAJ: '+(e?.message||e));}
  finally{if(btn){btn.disabled=false;btn.textContent=textoOriginal;}}
}

function clienteDoProcesso(p){
  const vinculado=(D.clientes||[]).find(c=>c.id===p.cliente_id);
  return vinculado?.nome || p.partes || '—';
}
function renderProcessosSIG(){
  const tb=document.getElementById('tbProcessos');
  if(!tb)return;
  const busca=(document.getElementById('buscaProcesso')?.value||'').replace(/\\D/g,'');
  const lista=(D.processos||[]).filter(p=>!busca || String(p.numero_cnj||'').replace(/\\D/g,'').includes(busca));
  tb.innerHTML=lista.map(p=>`<tr>
    <td>${esc(p.numero_cnj||'')}</td>
    <td>${esc(clienteDoProcesso(p))}</td>
    <td>${esc(p.area||'—')}</td>
    <td>${esc(p.comarca||'—')}</td>
    <td>${esc(p.vara||'—')}</td>
    <td>${esc(p.tribunal||'—')}</td>
    <td>${datajudLabel(p)}</td>
    <td style="white-space:nowrap">${acaoProcesso(p)} <button type="button" class="secondary" style="color:#b42318" onclick="excluirProcessoSIG('${p.id}','${esc(p.numero_cnj||'')}')">Excluir</button></td>
  </tr>`).join('');
  const cont=document.getElementById('contagemProcessos');
  if(cont)cont.textContent=lista.length+' de '+(D.processos||[]).length+' processo(s)';
}
async function excluirProcessoSIG(id,numero){
  const aviso='ATENÇÃO — EXCLUSÃO DEFINITIVA\\n\\nProcesso: '+numero+'\\n\\nAo confirmar, o processo será excluído do SIG e os registros vinculados, como movimentações, prazos, tarefas e agenda, também poderão ser removidos. Esta ação não pode ser desfeita.\\n\\nDeseja realmente excluir?';
  if(!confirm(aviso))return;
  const {error}=await sb.from('processos').delete().eq('id',id);
  if(error){alert('Não foi possível excluir o processo: '+error.message);return;}
  await load();
  alert('Processo excluído definitivamente do SIG.');
}
function prepararTelaProcessos(){
  const sec=document.getElementById('processos');
  if(!sec || document.getElementById('buscaProcesso'))return;
  const toolbar=sec.querySelector('.toolbar');
  const busca=document.createElement('div');
  busca.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 14px';
  busca.innerHTML='<input id="buscaProcesso" type="search" placeholder="Buscar número do processo" style="width:min(340px,100%);margin:0"><button type="button" class="secondary" id="limparBuscaProcesso">Limpar</button><span id="contagemProcessos" class="small"></span>';
  toolbar.insertAdjacentElement('afterend',busca);
  document.getElementById('buscaProcesso').addEventListener('input',renderProcessosSIG);
  document.getElementById('limparBuscaProcesso').onclick=()=>{document.getElementById('buscaProcesso').value='';renderProcessosSIG();};
  const th=sec.querySelector('thead tr');
  if(th)th.innerHTML='<th>Número</th><th>Cliente</th><th>Área</th><th>Comarca</th><th>Vara</th><th>Tribunal</th><th>Consulta</th><th>Ação</th>';
  const table=sec.querySelector('table');if(table)table.style.minWidth='1250px';
}
const renderOriginalSIG=render;
render=function(){renderOriginalSIG();prepararTelaProcessos();renderProcessosSIG();};
setTimeout(()=>{prepararTelaProcessos();renderProcessosSIG();},0);
<\/script>`;
    html=html.replace('</body>',extraScript+'\n</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(e){document.getElementById('loader').textContent='Falha ao carregar o SIG: '+e.message;}
})();
</script>
</body>
</html>
