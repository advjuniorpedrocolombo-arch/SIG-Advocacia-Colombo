<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIG — Advocacia Colombo</title>
</head>
<body>
<div id="loader" style="font-family:Arial,sans-serif;padding:32px;text-align:center">Carregando SIG...</div>
<script>
(async()=>{
  try{
    const r=await fetch('v2.html?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();

    html=html.replace(
      '<button class="secondary" id="btnAtualizarTodos" onclick="atualizarTodos(this)">Atualizar todos</button>',
      '<button class="secondary" id="btnAtualizarTodos" onclick="location.href=\'esaj-lote.html\'">Atualizar e-SAJ (lote)</button>'
    );

    html=html.replace(
      'Cadastre individualmente ou importe vários números CNJ de uma vez. A atualização tenta as fontes gratuitas disponíveis.',
      'Cadastre individualmente ou importe vários números CNJ de uma vez. Para processos TJSP, use a atualização em lote pela sessão autenticada do e-SAJ.'
    );

    html=html.replace('</body>', `<script>
window.importarLote=async function(){
  const raw=document.getElementById('listaCnj').value||'';
  const encontrados=[...raw.matchAll(/\\b\\d{7}-\\d{2}\\.\\d{4}\\.\\d\\.\\d{2}\\.\\d{4}\\b/g)]
    .map(m=>String(m[0]).replace(/\\D/g,''))
    .filter(n=>n.length===20);
  const nums=[...new Set(encontrados)];
  if(!nums.length)return alert('Nenhum número CNJ válido foi identificado.');
  const existentes=new Set(D.processos.map(x=>normalizaCNJ(x.numero_cnj)));
  const novos=nums.filter(n=>!existentes.has(n));
  if(!novos.length){alert('Todos os processos informados já estão cadastrados.');return}
  const rows=novos.map(n=>({user_id:U.id,numero_cnj:formataCNJ(n),titulo:'Processo '+formataCNJ(n),tribunal:tribunalDoCNJ(n),status:'ativo',monitorar_datajud:true}));
  const {error}=await sb.from('processos').insert(rows);
  if(error)return alert('Falha na importação: '+error.message);
  document.getElementById('fImportar').reset();closeM('mImportar');await load();
  alert(rows.length+' processo(s) importado(s). '+(nums.length-rows.length)+' já existente(s) ignorado(s).');
};
<\/script></body>`);

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loader').textContent='Falha ao carregar o SIG: '+e.message;
  }
})();
</script>
</body>
</html>
